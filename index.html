<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IUAM | Painel de Avisos</title>

<style>
:root{
  --teal:#0f6075;
  --teal-dark:#0a4b5b;
  --bg:#eef4f6;
  --text:#18343d;
  --muted:#6b7b82;
  --border:#dbe5e8;
  --white:#fff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.header{
  background:linear-gradient(135deg,var(--teal-dark),var(--teal));
  color:white;
  padding:30px 20px 26px;
  box-shadow:0 3px 14px #0002;
}

.header-inner{
  max-width:980px;
  margin:auto;
}

.logo{
  font-size:14px;
  font-weight:bold;
  letter-spacing:2px;
  opacity:.85;
  margin-bottom:8px;
}

.header h1{
  margin:0;
  font-size:30px;
  font-weight:700;
}

.header p{
  margin:8px 0 0;
  opacity:.88;
  font-size:15px;
}

.container{
  max-width:980px;
  margin:30px auto;
  padding:0 18px;
}

.topline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

.topline h2{
  margin:0;
  font-size:20px;
}

.updated{
  font-size:13px;
  color:var(--muted);
}

.notice{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:14px;
  margin:0 0 16px;
  padding:20px;
  box-shadow:0 3px 12px #0000000c;
  position:relative;
  overflow:hidden;
}

.notice::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:5px;
  background:var(--teal);
}

.notice-head{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
}

.date{
  color:var(--teal);
  font-weight:bold;
  font-size:14px;
}

.notice h3{
  margin:7px 0 4px;
  font-size:20px;
}

.time{
  font-weight:bold;
  background:#e9f3f5;
  color:var(--teal-dark);
  padding:7px 11px;
  border-radius:8px;
  white-space:nowrap;
}

.message{
  margin-top:14px;
  line-height:1.55;
  font-size:15px;
  color:#31484f;
}

.empty{
  background:white;
  border:1px dashed #bfd0d5;
  border-radius:14px;
  padding:45px 20px;
  text-align:center;
  color:var(--muted);
}

.footer{
  text-align:center;
  padding:25px 15px 35px;
  color:var(--muted);
  font-size:12px;
}

@media(max-width:600px){
  .header h1{
    font-size:25px;
  }

  .topline{
    display:block;
  }

  .updated{
    margin-top:6px;
  }

  .notice-head{
    display:block;
  }

  .time{
    display:inline-block;
    margin-top:10px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">IUAM</div>
    <h1>Painel de Avisos</h1>
    <p>Informações e alterações de agenda</p>
  </div>
</header>

<main class="container">

  <div class="topline">
    <h2>Avisos recentes</h2>
    <div class="updated" id="ultimaAtualizacao"></div>
  </div>

  <section id="avisos"></section>

</main>

<footer class="footer">
  Instituto de Urologia · Painel informativo
</footer>

<script>

/*
========================================================
EDITE SOMENTE OS AVISOS ABAIXO.

Campos disponíveis:
data
medico
horario
mensagem (opcional)

Se não colocar "mensagem", ela não aparecerá.
========================================================
*/

const avisos = [
  {
    data: "29/09/2026",
    medico: "Dr. João Silva",
    horario: "13:00."
  }
];

/* Não alterar abaixo desta linha */

function escapeHTML(text){
  return String(text).replace(/[&<>"']/g, function(c){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c];
  });
}

function mostrarAvisos(){

  const area = document.getElementById("avisos");

  if(!avisos.length){
    area.innerHTML = '<div class="empty">Não há avisos no momento.</div>';
    return;
  }

  area.innerHTML = avisos.map(aviso => {

    const mensagem = aviso.mensagem
      ? `
        <div class="message">
          ${escapeHTML(aviso.mensagem)}
        </div>
      `
      : "";

    return `
      <article class="notice">

        <div class="notice-head">

          <div>
            <div class="date">
              📅 ${escapeHTML(aviso.data)}
            </div>

            <h3>
              ${escapeHTML(aviso.medico)}
            </h3>
          </div>

          <div class="time">
            🕐 ${escapeHTML(aviso.horario)}
          </div>

        </div>

        ${mensagem}

      </article>
    `;

  }).join("");

  document.getElementById("ultimaAtualizacao").textContent =
    "Última atualização: " +
    new Date().toLocaleDateString("pt-BR");
}

mostrarAvisos();

</script>

</body>
</html>
